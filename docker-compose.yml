services:
  bendan:
    build: .
    container_name: bendan
    restart: unless-stopped
    environment:
      ONEBOT_WS_URL: ${ONEBOT_WS_URL:-ws://host.docker.internal:3001}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?Set ONEBOT_ACCESS_TOKEN in .env}
      ACTION_LEXICON_PATH: /etc/bendan/actions.json
    volumes:
      - ./actions.json:/etc/bendan/actions.json
    extra_hosts:
      - host.docker.internal:host-gateway
